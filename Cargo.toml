[workspace]
resolver = "2"
members = ["programs/alphabros_router", "programs/mock_swap", "tests"]

# Pins the verifiable-build image (solana-verify): solanafoundation/solana-verifiable-build:4.3.0 (platform-tools v1.57).
[workspace.metadata.cli]
solana = "4.3.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
